[model]

# cycle: quantum of time for data gathering and prediction (seconds)
cycle = 10

# usecorrelation: correlation coefficient in prediction algorithm
usecorrelation = true

# minsize: minimum map length (bytes) to track processes and shared libraries (500KB)
minsize = 500000

# Memory allowance formulas for NVMe + 16GB RAM + ZRAM
# max (0, TOTAL * memtotal + FREE * memfree) + CACHED * memcached
memtotal = 30
memfree = 80
memcached = 40

###########################################################################

[system]

# doscan: monitor running processes and update model state
doscan = true

# dopredict: make predictions and prefetch files into RAM page cache
dopredict = true

# autosave: save model state to disk every 30 minutes (seconds)
autosave = 1800

# mapprefix: path prefixes to consider for shared libraries and files
mapprefix = /opt;/usr/;/lib;/var/cache/;!/

# exeprefix: path prefixes to consider for binary executables
exeprefix = /opt;!/usr/sbin/;!/usr/local/sbin/;/usr/;!/

# processes: parallel readahead worker processes for NVMe I/O saturation
processes = 60

# sortstrategy: 0 = SORT_NONE (optimal for 0ms seek NVMe flash storage)
sortstrategy = 0
